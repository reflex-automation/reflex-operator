name: reflex-build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '35 6 * * 1' # weekly rescan
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/reflex-automation/reflex-operator:main

jobs:
  build-push:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: publish rendered manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kubectl kustomize config/default > operator.yaml
          gh release create latest --title latest --notes "rolling release: operator manifest rendered from main" || true
          gh release upload latest operator.yaml --clobber

  rescan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # for .trivyignore
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
